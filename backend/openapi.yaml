openapi: 3.0.3
info:
  title: Beirões LN API
  description: API for managing club personnel, events, match logistics, and transportation.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Docker Local Server
  - url: https://api.osbeiroes.cc
    description: Main API Server

paths:
  # --- Gestão de Utilizadores ---
  /auth/login:
    post:
      summary: Authenticate a user
      tags:
        - Gestão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contacto:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /jogadores/jogador:
    post:
      summary: Register a new player
      tags:
        - Gestão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogadorInput'
      responses:
        '201':
          description: Player registered successfully

  /jogadores/procurar:
    get:
      summary: Find a player by ID
      tags:
        - Gestão
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Player data retrieved
        '404':
          description: Not found

  # --- Calendário e Eventos ---
  /eventos:
    get:
      summary: List events filtered by month and year
      tags:
        - Eventos
      parameters:
        - name: ano
          in: query
          required: false
          schema:
            type: integer
        - name: mes
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of events for the specified month
        '400':
          description: Invalid year or month format
    post:
      summary: Create a new event (Treino or Jogo)
      tags:
        - Eventos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo:
                  type: string
                  enum: [Treino, Jogo]
                data_hora:
                  type: string
                  format: date-time
                local:
                  type: string
                adversario:
                  type: string
      responses:
        '201':
          description: Event created successfully
        '400':
          description: Validation error

  /comunicados:
    get:
      summary: List all official announcements
      tags:
        - Eventos
      responses:
        '200':
          description: Success
    post:
      summary: Publish a new announcement
      tags:
        - Eventos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                corpo:
                  type: string
      responses:
        '201':
          description: Published

  # --- Operações Desportivas ---
  /eventos/jogos/{id}/convocatoria:
    post:
      summary: Set match squad
      tags:
        - Operações Desportivas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jogadores:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Squad updated

  /eventos/jogos/{id}/resposta:
    post:
      summary: Register player response
      tags:
        - Operações Desportivas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jogador_id:
                  type: string
                resposta:
                  type: boolean
      responses:
        '200':
          description: Response recorded
        '400':
          description: Invalid data

  /eventos/treinos/{id}/presencas:
    post:
      summary: Record training attendance
      tags:
        - Operações Desportivas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  presente:
                    type: boolean
                  nota:
                    type: string
      responses:
        '200':
          description: Attendance saved

  # --- Logística (Boleias & Viaturas) ---
  /viaturas:
    get:
      summary: List all registered vehicles
      tags:
        - Logística
      responses:
        '200':
          description: List of vehicles
    post:
      summary: Register a new vehicle
      tags:
        - Logística
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, modelo, matricula, lugares_totais, proprietario_id]
              properties:
                id:
                  type: string
                modelo:
                  type: string
                matricula:
                  type: string
                lugares_totais:
                  type: integer
                proprietario_id:
                  type: string
      responses:
        '201':
          description: Vehicle registered successfully
        '400':
          description: Error registering vehicle

  /boleias:
    post:
      summary: Offer a ride
      tags:
        - Logística
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partida:
                  type: string
                  format: date-time
                viatura_id:
                  type: string
                jogo_id:
                  type: string
                max_lugares:
                  type: integer
      responses:
        '201':
          description: Ride created

    get:
      summary: Get rides available for a game
      tags:
        - Logística
      parameters:
        - name: jogo_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Rides retrieved
        '400':
          description: Missing game ID parameter

  /boleias/{id}/reservar:
    post:
      summary: Reserve a seat in a ride
      tags:
        - Logística
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: Seat reserved
        '404':
          description: User or ride not found
        '400':
          description: Error processing reservation

components:
  schemas:
    JogadorInput:
      type: object
      required: [id, nome, contacto, password, data_nascimento, posicao]
      properties:
        id:
          type: string
        nome:
          type: string
        contacto:
          type: string
        password:
          type: string
        data_nascimento:
          type: string
          format: date
        posicao:
          type: string
        nome_emergencia:
          type: string
        contacto_emergencia:
          type: string