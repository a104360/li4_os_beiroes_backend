version: "3.1"
services:
  mssql:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server
    ports:
      - "1433:1433"
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Root123!
    volumes:
      - ./database:/var/opt/mssql
      - ./init:/init

